<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinica Node</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="layout">
    <section id="loginView" class="panel login">
      <h1>Clinica Node</h1>
      <form id="loginForm">
        <input id="email" type="email" placeholder="Email" required>
        <input id="password" type="password" placeholder="Password" required>
        <button type="submit">Entrar</button>
      </form>
      <p id="loginMsg"></p>
    </section>

    <section id="appView" class="hidden">
      <header class="topbar">
        <div>
          <h1>Panel principal</h1>
          <p id="userInfo"></p>
        </div>
        <div class="counter">
          <span>Citas pendientes hoy</span>
          <strong id="pendientesHoy">0</strong>
        </div>
        <button id="logoutBtn">Salir</button>
      </header>

      <nav class="tabs">
        <button data-tab="pacientes">Pacientes</button>
        <button data-tab="citas">Citas</button>
        <button data-tab="historial">Historial</button>
        <button data-tab="admin">Admin</button>
      </nav>

      <section id="pacientes" class="panel tab">
        <h2>Gestion de pacientes</h2>
        <form id="pacienteForm" class="grid">
          <input name="nombre" placeholder="Nombre" required>
          <input name="apellidos" placeholder="Apellidos" required>
          <input name="dni" placeholder="DNI" required>
          <input name="telefono" placeholder="Telefono">
          <input name="email" type="email" placeholder="Email">
          <input name="fecha_nacimiento" type="date" required>
          <button type="submit">Crear paciente</button>
        </form>
        <div id="pacientesLista" class="list"></div>
      </section>

      <section id="citas" class="panel tab hidden">
        <h2>Gestion de citas</h2>
        <form id="citaForm" class="grid">
          <input name="id_paciente" type="number" placeholder="ID paciente" required>
          <input name="id_medico" type="number" placeholder="ID medico" required>
          <input name="fecha_hora" type="datetime-local" required>
          <input name="motivo" placeholder="Motivo" required>
          <input name="duracion_minutos" type="number" value="30" min="5">
          <button type="submit">Crear cita</button>
        </form>
        <div id="citasLista" class="list"></div>
      </section>

      <section id="historial" class="panel tab hidden">
        <h2>Historial clinico</h2>
        <form id="buscarHistorialForm" class="inline">
          <input name="id_paciente" type="number" placeholder="ID paciente" required>
          <button type="submit">Consultar</button>
        </form>
        <form id="entradaForm" class="grid">
          <input name="id_paciente" type="number" placeholder="ID paciente" required>
          <input name="id_cita" type="number" placeholder="ID cita" required>
          <input name="diagnostico" placeholder="Diagnostico" required>
          <input name="tratamiento" placeholder="Tratamiento" required>
          <textarea name="observaciones" placeholder="Observaciones" required></textarea>
          <button type="submit">Finalizar cita y guardar entrada</button>
        </form>
        <div id="historialDetalle" class="list"></div>
      </section>

      <section id="admin" class="panel tab hidden">
        <h2>Administracion</h2>
        <form id="usuarioForm" class="grid">
          <input name="nombre" placeholder="Nombre" required>
          <input name="email" type="email" placeholder="Email" required>
          <input name="password" type="password" placeholder="Password" required>
          <select name="rol">
            <option value="medico">Medico</option>
            <option value="recepcionista">Recepcionista</option>
            <option value="administrador">Administrador</option>
          </select>
          <input name="especialidad" placeholder="Especialidad">
          <button type="submit">Crear usuario</button>
        </form>
        <form id="generarForm" class="inline">
          <input name="cantidad" type="number" min="1" value="5">
          <button type="submit">Generar pacientes</button>
        </form>
        <pre id="metricas"></pre>
      </section>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="./app.js"></script>
</body>
</html>
